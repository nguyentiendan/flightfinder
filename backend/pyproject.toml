[project]
name = "flight-finder-backend"
version = "0.1.0"
description = "Multi-agent Flight Finder backend — FastAPI + LangGraph (bam slide CyberSoft trang 72-75)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
